<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>MCR Concept</title>
<link rel="icon" href="/img/mcr-logo-square.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Calibri,Carlito,"Segoe UI",sans-serif;background:#F3F6F9;color:#1d2a33;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(0,40,70,.12);max-width:440px;width:100%;overflow:hidden;text-align:center}
.top{background:#004E7A;padding:26px;border-bottom:5px solid #CC0000}
.top img{width:200px;max-width:70%}
.in{padding:30px 26px 34px}
h1{font-size:26px;color:#004E7A;margin-bottom:10px}
p{font-size:18px;line-height:1.5;color:#44525c}
.sp{width:42px;height:42px;border:4px solid #D6E2EB;border-top-color:#CC0000;border-radius:50%;margin:22px auto 0;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.bt{display:none;margin-top:24px;gap:10px;justify-content:center;flex-wrap:wrap}
.bt a{font:700 17px Calibri,Carlito,sans-serif;text-decoration:none;padding:12px 22px;border-radius:30px}
.home{background:#CC0000;color:#fff}.wa{background:#25D366;color:#fff}
</style></head><body>
<div class="box"><div class="top"><img src="/img/mcr-logo.png" alt="MCR Concept"></div>
<div class="in">
 <h1 id="t">Loading the page…</h1>
 <p id="m">The website is updating. This will only take a moment.</p>
 <div class="sp" id="s"></div>
 <div class="bt" id="b"><a class="home" href="/">Go to Home Page</a><a class="wa" href="https://wa.me/94729818965" target="_blank" rel="noopener">WhatsApp Us</a></div>
</div></div>
<script>
(function(){
  var p=location.pathname;
  if(/^\/(preview|draft)(\/|$)/i.test(p)){location.replace((p.replace(/^\/(preview|draft)/i,'')||'/')+location.search+location.hash);return;}
  var key='mcr404:'+location.pathname, n=0;
  try{n=parseInt(sessionStorage.getItem(key)||'0',10)}catch(e){}
  function fail(){
    try{sessionStorage.removeItem(key)}catch(e){}
    document.getElementById('t').textContent='Page not found';
    document.getElementById('m').textContent='Sorry, this page does not exist. Please go to the home page or message us on WhatsApp.';
    document.getElementById('s').style.display='none';
    document.getElementById('b').style.display='flex';
  }
  if(n>=4) return fail();
  try{sessionStorage.setItem(key,String(n+1))}catch(e){return fail()}
  setTimeout(function(){location.reload()},5000);
})();
</script>
</body></html>
